    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        window.exportToExcel = (headers, rows, filename) => {
            const wb = XLSX.utils.book_new();
            const wsData = [headers, ...rows];
            const ws = XLSX.utils.aoa_to_sheet(wsData);
            XLSX.utils.book_append_sheet(wb, ws, "Hoja1");
            XLSX.writeFile(wb, filename + ".xlsx");
        };

        window.importarDesdeExcel = (input) => {
            return new Promise((resolve) => {
                const file = input.files[0];
                if (!file) {
                    resolve([]);
                    return;
                }
                const name = file.name.toLowerCase();
                if (!name.endsWith('.xls') && !name.endsWith('.xlsx')) {
                    alert('Seleccione un archivo de Excel (.xls o .xlsx).');
                    resolve([]);
                    return;
                }
                const reader = new FileReader();
                reader.onload = e => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        if (!workbook.SheetNames.length) {
                            alert('El archivo no contiene hojas válidas.');
                            resolve([]);
                            return;
                        }
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                        const result = [];
                        const errors = [];
                        for (let i = 0; i < rows.length; i++) {
                            const row = rows[i];
                            const codigo = row[0];
                            const qty = parseInt(row[1], 10);
                            if (!codigo || codigo.toString().trim() === '') {
                                errors.push(`Fila ${i + 1}: código faltante`);
                                continue;
                            }
                            if (isNaN(qty)) {
                                errors.push(`Fila ${i + 1}: cantidad inválida`);
                                continue;
                            }
                            result.push({ idArticulo: codigo.toString(), cantidad: qty });
                        }
                        if (errors.length) {
                            alert(errors.join('\n'));
                        }
                        resolve(result);
                    } catch (err) {
                        alert('No se pudo procesar el archivo. Asegúrese de que sea un Excel válido.');
                        resolve([]);
                    }
                };
                reader.onerror = () => {
                    alert('No se pudo leer el archivo.');
                    resolve([]);
                };
                try {
                    reader.readAsArrayBuffer(file);
                } catch (err) {
                    alert('El archivo seleccionado no es válido.');
                    resolve([]);
                }
            });
        };

        window.triggerFileInput = (input) => {
            input.value = '';
            input.click();
        };
    </script>
    <script>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script>
        window.generateBarcode = function (elementId, code) {
            try {
                const element = document.getElementById(elementId);
                if (!element) return;

                // Limpiar contenido previo
                element.innerHTML = '';

                // Generar código de barras Code128 con alta calidad para impresión
                JsBarcode(element, code, {
                    format: "CODE128",
                    width: 2.5,        // Ancho de las barras (más ancho = más legible)
                    height: 50,        // Altura de las barras
                    displayValue: false,  // No mostrar el texto debajo (se mantiene el estilo actual)
                    margin: 5,         // Margen alrededor
                    background: "#ffffff",
                    lineColor: "#000000",
                    valid: function (valid) {
                        if (!valid) {
                            console.error("Código de barras inválido:", code);
                        }
                    }
                });
            } catch (error) {
                console.error("Error generando código de barras:", error);
            }
        };
    </script>
    <script src="js/sessionSync.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Verificar conexión periódicamente y limpiar cache si es necesario
        let lastConnectionCheck = Date.now();
        const CONNECTION_CHECK_INTERVAL = 30000; // 30 segundos

        async function checkConnection() {
            try {
                const response = await fetch('/_framework/blazor.boot.json', {
                    method: 'HEAD',
                    cache: 'no-store'
                });
                lastConnectionCheck = Date.now();
            } catch (error) {
                console.warn('Problema de conexión detectado:', error);
                // Si hay problemas de conexión, forzar recarga limpia
                if (Date.now() - lastConnectionCheck > 60000) {
                    // Si no hay conexión por más de 1 minuto, limpiar cache y recargar
                    if ('caches' in window) {
                        caches.keys().then(names => {
                            names.forEach(name => caches.delete(name));
                        });
                    }
                    // Limpiar LocalStorage si está corrompido
                    try {
                        localStorage.getItem('authToken');
                    } catch (e) {
                        console.error('LocalStorage corrompido, limpiando...');
                        localStorage.clear();
                    }
                }
            }
        }

        // Verificar conexión cada 30 segundos
        setInterval(checkConnection, CONNECTION_CHECK_INTERVAL);

        // Manejar eventos de visibilidad para verificar cuando la página vuelve a estar activa
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) {
                checkConnection();
            }
        });

        // Manejar errores de carga de Blazor
        window.addEventListener('error', function (e) {
            if (e.message && e.message.includes('blazor')) {
                console.error('Error de Blazor detectado, recargando...');
                setTimeout(() => {
                    window.location.reload(true);
                }, 1000);
            }
        });
    </script>
